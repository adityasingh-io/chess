# Publishes the app to GitHub Pages, at adityasingh.io/chess/ (the user site's domain plus this repo's
# name). Runs when CI passes on main, and from the nightly after it commits new data: a push made with the
# workflow's own token doesn't start other workflows, so the nightly calls this one itself.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main             # the latest main, including a data commit the nightly just pushed
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `build` ends with the secret scan of dist/.
      - run: npm run build
        env:
          COACH_GITHUB_PAGES_BASE: /chess/
          VITE_UPDATE_URL: https://chess-update.adityasingh-io.workers.dev
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
