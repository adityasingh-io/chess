# Chess coach settings. Every tunable number lives here; secrets live in .env.
# Win% values are from the player's point of view unless a comment says otherwise.

[player]
username = "r00k4ndr0ll"
since = "2026-01-01"            # only games that started on or after this date
time_classes = ["rapid"]
rating_goal = 1000
goal_date = "2026-12-31"

[engine]
version = "Stockfish 19"        # the pipeline refuses to analyse with any other binary
workers = 10                    # parallel engines, one search thread each

# Pass 1: every position of every game. Labels, accuracy and Win% drops come from here.
[engine.pass1]
nodes = 2_000_000                # chosen by the 2026-10-24 study, docs/calibration.md
multipv = 2
hash_mb = 128

# Pass 2: deeper look at candidate positions. Lines, mistake types and puzzles come from here.
[engine.pass2]
nodes = 16_000_000               # chosen by the 2026-10-24 study, docs/calibration.md
multipv = 3
hash_mb = 256

# These also define the analysis model, so pass 2 always covers what it needs: a mistake record is
# a drop of min_drop+, "clearly best" means a gap of min_gap+, "missed a win" needs a drop of
# follow_min_drop+, and the human-findable filter allows line_my_moves of my moves.
[engine.pass2.triggers]
min_drop = 5.0                  # my moves that drop my Win% by at least this much
min_gap = 20.0                  # my-turn positions where best minus second-best is at least this
follow_min_drop = 15.0          # also follow the best line of drops this big (possible missed wins)
line_my_moves = 3               # follow candidate lines for up to this many of my moves (6 plies)

[engine.lines]
pv_plies = 10                   # how much of Stockfish's line to use and show

[analysis.garbage_time]
below = 10.0                    # ignore my move if my Win% before it was below this,
above = 90.0                    # or above this
still_above = 60.0              # and still above this after it

[analysis.labels]               # by the mover's Win% drop; Book and Best come first
excellent = 2.0                 # drop below this is Excellent
good = 5.0                      # below this, Good
inaccuracy = 10.0               # below this, Inaccuracy
mistake = 15.0                  # below this, Mistake; this or more is a Blunder

[analysis.marks]                # chess.com-style Brilliant, Great and Miss, on top of the label (one per move at most),
                                # from Stockfish's pass-1 lines (MultiPV 2) and material counted along them
great_gap = 15.0                # Great: Stockfish's best move, and its second choice was at least this much Win% worse
                                # (a Blunder); not a recapture on the square just captured on, nor the only legal move
brilliant_material = 2          # Brilliant: a Best or Excellent move where one of Stockfish's top two replies takes the
                                # piece that moved, and the mover is still this much material down after their next move
                                # in that line (a line that stops at the capture doesn't count)
brilliant_max_before = 90.0     #   while not already winning: the mover's Win% before the move is below this
brilliant_min_after = 40.0      #   and not worse off: the mover's Win% after it is at least this
miss_chance = 10.0              # Miss: the opponent's move before gave the mover at least this much Win% (a Mistake or
                                # worse), and this move gave back at least this much of it too,
miss_gave_back = 0.5            #   and at least this share of it, but not more than all of it (that's a plain blunder)

[analysis.phases]
opening_moves = 12              # moves 1-12 are the opening, plus later moves still in book
endgame_non_pawn = 13           # the endgame starts when each side has at most this much non-pawn material

[analysis.types]
material_loss = -2              # hung a piece / walked into a tactic: net material this or worse
material_win = 2                # missed a win / free material: net material this or better
missed_mate_max = 3             # missed mate: Stockfish had mate in this many or fewer

[analysis.flags]
threw_win_before = 80.0         # threw away a win: Win% before at least this
threw_win_after = 60.0          # and after below this
fast_percentile = 25            # fast blunder: think time below this percentile of mine for the time control
fast_min_moves = 20             # needs at least this many of my timed moves in that time control
time_trouble = 0.10             # clock below this share of the starting time
after_loss_minutes = 30         # game started within this many minutes of a loss ending

[analysis.losses]
playable = 40.0                 # lost on time / gave up with my Win% at least this
turning_from = 40.0             # turning point: my first move from at least this
turning_to = 25.0               # to this or below; with no such move, the move after which my Win% never got
turning_drop = 15.0             # back to turning_from, if it lost at least this (15 is where Blunder starts)
winning = 80.0                  # winning games not won: my Win% reached this

[key_moments]                   # each game's key moment (PLAN.md, reading 25): every legal move there scored with pass 1
games = 50                      # for my newest this many games (about 35 positions each); older ones keep theirs once scored

[analysis.openings]
leak_drop = 10.0                # leak position: my move there loses this much Win% on average,
leak_score_gap = 15.0           # or my score from it is this many points below my same-colour average,
leak_min_games = 5              # over at least this many games
surprise_share = 10.0           # surprise: players at my level choose the opponent's move under this %
surprise_min_games = 20         # and the explorer has at least this many games there
tree_min_games = 2              # explorer stats for tree positions I reached in at least this many games

[analysis.endgames]
winning = 70.0                  # my Win% at the start: at least this is winning,
losing = 30.0                   # at most this is losing, in between is balanced

[analysis.insights]
recent_games = 20               # trends compare the last N games with the N before
rating_band = 100               # opponent rating bands
think_buckets = [2, 5, 10, 20, 40]   # think-time bucket edges, seconds
length_buckets = [40, 60, 80, 100]   # game length bucket edges, plies

[explorer]                      # Lichess opening explorer (token from .env, no scopes)
url = "https://explorer.lichess.org/lichess"
masters_url = "https://explorer.lichess.org/masters"   # what masters play (OTB games), shown next to my level
speeds = ["rapid"]
ratings = [1000, 1200]          # buckets for players at my level; see rating_map
moves = 12

[puzzles]                       # BRIEF.md step 5
max_plies = 6                   # my puzzles follow Stockfish's line while each of my moves is clearly best, up to this
lichess_ratings = [400, 1400]   # Lichess puzzles kept: rating range,
lichess_min_popularity = 80     # popularity (-100 to 100),
lichess_min_plays = 500         # and times played
lichess_count = 5000            # size of the subset picked by my mistakes' themes and my openings
lichess_band = 100              # spread each theme's share across rating bands this wide
lichess_theme_min = 150         # every theme my tags map to gets at least this many
lichess_opening_share = 0.2     # share of the subset picked by my openings' OpeningTags
lichess_families = 6            # my most played opening families used for that
lichess_endgame_min = 100       # and on top, this many of each Lichess endgame theme (pawn, rook, queen, minor pieces)

[repertoire]                    # the trainer's lines: `coach repertoire` writes a starter PGN if it's missing
pgn = "repertoire.pgn"
plies = 20                      # starter lines run to this many plies (fewer if players at my level stop)
min_games = 50                  # stop a line where the explorer has fewer games at my level
cover_min_games = 5             # an opponent's reply in at least this many of my games gets a trainer line (coverage)
white = ["Queen's Gambit Declined", "Queen's Gambit Accepted", "Slav Defense", "Queen's Gambit Declined: Albin Countergambit"]
black = ["Caro-Kann Defense: Classical Variation", "Caro-Kann Defense: Advance Variation",
         "Caro-Kann Defense: Exchange Variation", "Slav Defense"]

[notes]                         # AI-worded coach notes (src/coach/notes.py); short-lived credentials only
enabled = false                 # also run by `coach update`, and shown in the game viewer
count = 30                      # my costliest confirmed mistakes get one
model = "claude-opus-5-5"
effort = "low"                  # rewording only, so little thinking
max_tokens = 4000               # includes thinking; a reply cut short keeps the template

[rating_map]                    # chess.com rapid -> Lichess rapid (lucb3, "Converting Chess.com to Lichess ratings")
chesscom = [600, 700, 800, 1000, 1100]
lichess = [980, 1070, 1165, 1350, 1440]

[bots]                          # Play on (Compare): Maia-2 answers like Lichess rapid players at these chess.com rapid
maia_chesscom = [600, 800, 1000]  # ratings, converted with rating_map; Stockfish at full strength is the other bot

[export]
dir = "web/public/data"
timezone = "Asia/Kolkata"       # for hour-of-day insights

[tagger_check]
puzzle_url = "https://database.lichess.org/lichess_db_puzzle.csv.zst"
sample = 20_000                 # puzzles read from the start of the file (it's in random id order)

[calibration]
moves = 100                     # my moves sampled (each gives a before and an after position)
pass1_budgets = [250_000, 500_000, 1_000_000, 2_000_000, 4_000_000]
pass2_budgets = [2_000_000, 4_000_000, 8_000_000, 16_000_000]
reference_nodes = 64_000_000
reference_hash_mb = 256         # 10 workers x 256 MB keeps memory near 3 GB
seed = 2026
