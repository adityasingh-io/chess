[project]
name = "coach"
version = "0.1.0"
description = "Personal chess coach: Stockfish analysis of chess.com games, exported as static JSON"
readme = "README.md"
authors = [
    { name = "adityasingh", email = "treanter1@gmail.com" }
]
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "chess>=1.11.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
coach = "coach.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs the Stockfish binary from STOCKFISH_PATH"]
